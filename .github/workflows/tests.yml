name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    # Uses fake model services: no API key or network access to the class endpoints needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
