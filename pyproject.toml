[project]
name = "course-assistant"
version = "0.1.0"
description = "Course assistant: hybrid RAG Q&A and practice quizzes over course files"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.12",
    "chromadb>=1.5.9",
    "gradio>=6.29.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
course-assistant = "course_assistant.app:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real class services (needs CLASS_API_KEY); run with -m live"]
addopts = "-m 'not live'"
